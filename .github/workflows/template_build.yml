name: Template - Build

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '18'
      environment:
        required: true
        type: string
    outputs:
      build_status:
        value: ${{ jobs.build.outputs.status }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install and Build
        run: |
          npm ci
          npm run build --if-present